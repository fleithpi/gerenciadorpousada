<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - Sistema Pousada</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .register-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 320px; }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #666; }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #28a745; border: 0; color: white; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background: #218838; }
        .flash-messages { background: #ffe3e3; color: #c82333; padding: 10px; border-radius: 4px; margin-bottom: 15px; font-size: 14px; list-style: none; padding-left: 10px; }
        .link-login { text-align: center; margin-top: 15px; font-size: 14px; }
        .link-login a { color: #007bff; text-decoration: none; }
    </style>
</head>
<body>

<div class="register-container">
    <h2>Criar Conta Cliente</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <ul class="flash-messages">
        {% for category, message in messages %}
          <li>{{ message }}</li>
        {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <form action="/registrar" method="POST">
        <div class="form-group">
            <label for="username">Escolha um Usuário</label>
            <input type="text" id="username" name="username" required autocomplete="off">
        </div>
        <div class="form-group">
            <label for="password">Escolha uma Senha</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit">Cadastrar Conta</button>
    </form>

    <div class="link-login">
        Já tem uma conta? <a href="/login">Voltar para o Login</a>
    </div>
</div>

</body>
</html>
